name: Build and Release MCPB

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "*.md"
      - ".github/**"
      - ".gitignore"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build server (tsc)
        run: npm run build

      - name: Pack .mcpb bundle
        run: npx --yes @anthropic-ai/mcpb pack . filesystem-mcpb.mcpb

      - name: Read version from manifest
        id: version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create/update rolling "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest build (v${{ steps.version.outputs.version }})"
          body: |
            Automatically built from commit ${{ github.sha }}.
            Manifest version: ${{ steps.version.outputs.version }}
          make_latest: true
          files: filesystem-mcpb.mcpb

      - name: Create/update versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "v${{ steps.version.outputs.version }}"
          body: |
            Built from commit ${{ github.sha }}.
          files: filesystem-mcpb.mcpb
